[package]
name = "php-pdo-ords"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "php_pdo_ords"
crate-type = ["cdylib", "staticlib"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[build-dependencies]
cc = "1"
